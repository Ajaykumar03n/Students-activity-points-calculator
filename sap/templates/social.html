<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Activities</title>
    <style>
        body {
            background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 20px;
        }

        h2, h3 {
            text-align: center;
            color: rgb(151, 56, 210);
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #333;
        }

        input[type="file"],
        input[type="text"],
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="file"]:focus,
        input[type="text"]:focus {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
            outline: none;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .radio-group label {
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
            text-align: left;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: rgb(151, 56, 210);
            color: white;
            border-color: rgb(151, 56, 210);
        }

        input[type=submit] {
            width: 100%;
            background-color: rgb(151, 56, 210);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type=submit]:hover {
            background-color: rgb(120, 40, 170);
        }

        .note {
            margin: 10px 0;
            font-size: 14px;
            color: #ec0e0e;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Social Activities</h2>
    <form method="POST" action="{{ url_for('social') }}" enctype="multipart/form-data">
        <h3>Community Services:</h3>
        
        <div class="radio-group">
            <input type="radio" name="activity" value="Blood Donation, Social March, Swach Bharat Activities" id="community_service_1">
            <label for="community_service_1">Blood Donation, Social March, Swach Bharat Activities</label>

            <input type="radio" name="activity" value="NSS/NCC Camp (1 to 2 weeks)" id="nss_ncc_1">
            <label for="nss_ncc_1">NSS/NCC Camp (1 to 2 weeks)</label>

            <input type="radio" name="activity" value="NSS/NCC Camp (more than 2 weeks)" id="nss_ncc_2">
            <label for="nss_ncc_2">NSS/NCC Camp (more than 2 weeks)</label>
        </div>

        <div class="note">Note: If you have participated in more than one activity, please fill out the form again.</div>

        <label for="proof">Upload Proof:</label>
        <input type="file" id="proof" name="proof"><br><br>

        <input type="submit" value="Submit">
    </form>
</div>
</body>
</html>
