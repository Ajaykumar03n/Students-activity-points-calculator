<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrepreneurship</title>
    <style>
        body {
            background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 10px;
        }
        #liveFeedSettingSideBar {
    width: 1px; /* Set the desired width */
    height: 1px; /* Set the desired height */
    background-color: transparent;
}
        div {          
            background-color: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            text-align: left;
        }

        .container {
            display: block;
            position: relative;
            padding-left: 35px;
            margin-bottom: 1px;
            cursor: pointer;
            font-size: 20px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            margin-left: auto;
            margin-right: auto;
        }

        .container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }  

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 25px;
            width: 25px;
            background-color: #eee;
            border-radius: 4px;
        }

        .container:hover input ~ .checkmark {
            background-color: #ccc;
        }

        .container input:checked ~ .checkmark {
            background-color: rgb(151, 56, 210);
        }  

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .container input:checked ~ .checkmark:after {
            display: block;
        }

        .container .checkmark:after {
            top: 7px;
            left: 9px;
            width: 6px;
            height: 12px;
            border: solid #fff;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }
 
        input[type=text], select {
            width: 100%;
            padding: 20px 120px 30px 5px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type=SUBMIT] {
            width: 100%;
            background-color: #61579a;      
            color: white;
            padding: 12px 10px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            border-radius: 50px;
        }

        input[type=submit]:hover {
            background-color: #ab84ed;
        }
    </style>
</head>
<body>
<div>
    <h2 align="center">Entrepreneurship</h2>
    <form method="POST" action="{{ url_for('enterp') }}" enctype="multipart/form-data">
        <h3>Entrepreneurship Activities:</h3>
        <label class="container">Workshop Attended
            <input type="checkbox" name="checkbox1" value="Workshop Attended">
            <span class="checkmark"></span>
        </label><br>
        <input type="number" id="workshop_attended" name="workshop_attended"><br><br>
        <label for="myfile">ADD FILE:</label>
        <input type="file" id="myfile" name="myfile1"><br><br>
       
        <label class="container">Registered for start-up
            <input type="checkbox" name="checkbox2" value="Registered for start up">
            <span class="checkmark"></span>
        </label><br>
        <input type="number" id="registered_for_start_up" name="registered_for_start_up"><br><br>
        <label for="myfile">ADD FILE:</label>
        <input type="file" id="myfile" name="myfile2"><br><br>

        <label class="container">Released Product
            <input type="checkbox" name="checkbox3" value="Released Product">
            <span class="checkmark"></span>
        </label><br>
        <input type="number" id="released_product" name="released_product"><br><br>
        <label for="myfile">ADD FILE:</label>
        <input type="file" id="myfile" name="myfile3"><br><br>
<h3>Price Money/Seed Money Granted</h3>
        <input type="text" id="price" name="price">
       
        <input type="submit">
    </form>
</div>

</body>
</html>
