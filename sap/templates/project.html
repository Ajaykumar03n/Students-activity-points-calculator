    <style>
      * {
          box-sizing: border-box;
      }

      body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
      }

      .container {
          max-width: 600px;
          background-color: rgba(255, 255, 255, 0.8);
          padding: 30px;
          border-radius: 25px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
          margin: 20px;
          transition: all 0.3s ease;
      }

      .container:hover {
          box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
          text-align: center;
          color: rgb(151, 56, 210);
          margin-bottom: 20px;
      }

      label {
          display: block;
          margin-bottom: 8px;
          font-size: 16px;
          color: #333;
      }

      input[type="text"],
      input[type="date"],
      input[type="file"],
      select {
          width: 100%;
          padding: 12px;
          margin-bottom: 15px;
          border: 1px solid #ddd;
          border-radius: 20px;
          background-color: #f9f9f9;
          font-size: 16px;
          transition: background-color 0.3s ease, border-color 0.3s ease;
      }

      input[type="text"]:focus,
      input[type="date"]:focus,
      input[type="file"]:focus,
      select:focus {
          background-color: #eef6ff;
          border-color: rgb(151, 56, 210);
          outline: none;
      }

      .radio-group {
          display: flex;
          justify-content: space-between;
          margin-bottom: 20px;
          gap: 10px;
      }

      .radio-group label {
          flex: 1;
          text-align: center;
          padding: 10px;
          background-color: #f9f9f9;
          border: 1px solid #ddd;
          border-radius: 15px;
          cursor: pointer;
          transition: background-color 0.3s ease;
      }

      .radio-group input[type="radio"] {
          display: none;
      }

      .radio-group input[type="radio"]:checked + label {
          background-color: rgb(151, 56, 210);
          color: white;
          border-color: rgb(151, 56, 210);
      }

      input[type="submit"] {
          width: 100%;
          background-color: rgb(151, 56, 210);
          color: white;
          padding: 15px;
          border: none;
          border-radius: 25px;
          font-size: 18px;
          cursor: pointer;
          transition: background-color 0.3s ease;
      }

      input[type="submit"]:hover {
          background-color: rgb(151, 56, 210);
      }

      .custom-file-upload {
          border: 1px solid #ddd;
          border-radius: 20px;
          display: inline-block;
          padding: 12px;
          cursor: pointer;
          background-color: #f9f9f9;
          font-size: 16px;
          transition: background-color 0.3s ease, border-color 0.3s ease;
      }

      .custom-file-upload:hover {
          background-color: #eef6ff;
          border-color: rgb(151, 56, 210);
      }

      .file-input {
          display: none;
      }
      
      .file-upload-container {
          position: relative;
          width: 100%;
      }

      .file-upload-container input[type="file"] + label {
          width: 100%;
          text-align: center;
      }

  </style>
</head>
