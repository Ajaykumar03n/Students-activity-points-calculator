<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE/CAT/Govt Exams</title>
    <style>
        body {
            background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 20px;
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: rgb(151, 56, 210);
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 20px;
            color: rgb(51, 51, 51);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #333;
        }

        input[type="text"],
        input[type="file"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="file"]:focus,
        input[type="number"]:focus,
        select:focus {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
            outline: none;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .radio-group label {
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: rgb(151, 56, 210);
            color: white;
            border-color: rgb(151, 56, 210);
        }

        input[type=submit] {
            width: 100%;
            background-color: rgb(151, 56, 210);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type=submit]:hover {
            background-color: rgb(120, 40, 170);
        }

        .note {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
        .custom-file-upload {
            border: 1px solid #ddd;
            border-radius: 20px;
            display: inline-block;
            padding: 12px;
            cursor: pointer;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
        }
        .file-input {
            display: none;
        }
        
        .file-upload-container {
            position: relative;
            width: 100%;
        }

        .file-upload-container input[type="file"] + label {
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>GATE/CAT/Govt Exams</h2>
    <form method="POST" action="{{ url_for('gate') }}" enctype="multipart/form-data">
        <h3>GATE/CAT/Govt Exams</h3>
        <div class="radio-group">
            <input type="radio" name="exam_status" value="appeared" id="appeared">
            <label for="appeared">Appeared</label>
        </div>
        
        <div class="radio-group">
            <input type="radio" name="exam_status" value="qualified" id="qualified">
            <label for="qualified">Qualified in GATE/CAT/etc...</label>
        </div>

        <div class="radio-group">
            <input type="radio" name="exam_status" value="good_ranking" id="good_ranking">
            <label for="good_ranking">Good National Ranking</label>
        </div>

        <div class="radio-group">
            <input type="radio" name="exam_status" value="cleared_govt_exams" id="cleared_govt_exams">
            <label for="cleared_govt_exams">Cleared Govt Exams</label>
        </div>

        <label for="proof">Upload Proof:</label>
        <div class="file-upload-container">
            <input type="file" id="proof" name="proof" class="file-input">
            <label for="proof" class="custom-file-upload">Choose File</label>
        </div>

        <div class="note">Note: If you have more than one exam, please fill out the form again.</div>

        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
