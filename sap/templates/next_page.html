<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .success-message {
      color: green;
      font-weight: bold;
    }
    .error-message {
      color: red;
      font-weight: bold;
    }
    .link-container {
      margin-top: 20px;
    }
    .link-container a {
      margin-right: 10px;
      text-decoration: none;
      color: blue;
    }
  </style>
</head>
<body>
  <div class="container">
    {% if stored_successfully %}
      <p class="success-message">Data stored successfully!</p>
    {% else %}
      <p class="error-message">Error storing data! Please try again.</p>
    {% endif %}
    <div class="link-container">
      <a href="{{ url_for('logout') }}">Logout</a>
      <a href="{{ url_for('dashboard1') }}">Dashboard</a>
    </div>
  </div>
</body>
</html>
