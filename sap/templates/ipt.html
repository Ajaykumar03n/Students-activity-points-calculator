<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement and Internship</title>
    <style>
        body {
            background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 20px;
        }

        h2, h3 {
            text-align: center;
            color: rgb(151, 56, 210);
            margin-bottom: 20px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group label {
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
            text-align: left;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: rgb(151, 56, 210);
            color: white;
            border-color: rgb(151, 56, 210);
        }

        .note {
            margin: 10px 0;
            font-size: 14px;
            color: #ec0e0e;
            text-align: center;
        }

        input[type="file"],
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="file"]:focus,
        input[type="submit"]:hover {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
        }

        input[type=submit] {
            background-color: rgb(151, 56, 210);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type=submit]:hover {
            background-color: rgb(120, 40, 170);
        }
        .custom-file-upload {
            border: 1px solid #ddd;
            border-radius: 20px;
            display: inline-block;
            padding: 12px;
            cursor: pointer;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
        }
        .file-input {
            display: none;
        }
        
        .file-upload-container {
            position: relative;
            width: 100%;
        }

        .file-upload-container input[type="file"] + label {
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Placement and Internship</h2>
    <form method="POST" action="{{ url_for('ipt') }}" enctype="multipart/form-data">
        <h3>Select Placement Status:</h3>
        <div class="radio-group">
            <input type="radio" name="status" value="written test cleared" id="written_test_cleared">
            <label for="written_test_cleared">Written Test Cleared</label>

            <input type="radio" name="status" value="placed" id="placed">
            <label for="placed">Placed</label>

            <input type="radio" name="status" value="placed with internship" id="placed_with_internship">
            <label for="placed_with_internship">Placed with Internship</label>

            <input type="radio" name="status" value="internship without placement" id="internship_without_placement">
            <label for="internship_without_placement">Internship without Placement</label>
        </div>

        <div class="note">Note: If you have more than one placement or internship, please fill out the form again.</div>

        <label for="proof">Upload Proof:<br></label>
        <div class="file-upload-container">
            <input type="file" id="proof" name="proof" class="file-input">
            <label for="proof" class="custom-file-upload">Choose File</label>
        </div><br>

        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
