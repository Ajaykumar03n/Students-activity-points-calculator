<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Courses</title>
    <style>
        body {
            background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: rgb(151, 56, 210);
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 20px;
            color: rgb(51, 51, 51);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #333;
        }

        input[type="file"],
        input[type="number"],
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="file"]:focus,
        input[type="number"]:focus {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
            outline: none;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .radio-group label {
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
            text-align: left;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: rgb(151, 56, 210);
            color: white;
            border-color: rgb(151, 56, 210);
        }

        input[type=submit] {
            width: 100%;
            background-color: rgb(151, 56, 210);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type=submit]:hover {
            background-color: rgb(120, 40, 170);
        }

        .note {
            margin: 10px 0;
            font-size: 14px;
            color: #f70c0c;
            text-align: center;
        }
        .custom-file-upload {
            border: 1px solid #ddd;
            border-radius: 20px;
            display: inline-block;
            padding: 12px;
            cursor: pointer;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
        }

        .file-input {
            display: none;
        }
        
        .file-upload-container {
            position: relative;
            width: 100%;
        }

        .file-upload-container input[type="file"] + label {
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Online Courses</h2>
    <form method="POST" action="{{ url_for('online') }}" enctype="multipart/form-data">
        <h3>VAC/Online Course</h3>
        <div class="radio-group">
            <input type="radio" name="course_type" value="Value Added Course (Non-Credit)" id="vac">
            <label for="vac">Value Added Course (Non-Credit)</label>

            <input type="radio" name="course_type" value="NPTEL One Credit" id="nptel_one">
            <label for="nptel_one">NPTEL and Credit Courses (One Credit)</label>

            <input type="radio" name="course_type" value="NPTEL Two Credit" id="nptel_two">
            <label for="nptel_two">NPTEL and Credit Courses (Two Credit)</label>

            <input type="radio" name="course_type" value="NPTEL Three or More Credits" id="nptel_three">
            <label for="nptel_three">NPTEL and Credit Courses (Three or More Credits)</label>
        </div>
        <label for="proof">Upload Proof:</label>
        <div class="file-upload-container">
            <input type="file" id="proof" name="proof" class="file-input">
            <label for="proof" class="custom-file-upload">Choose File</label>
        </div>

        <div class="note">Note: If you have more than one course, please fill out the form again.</div>

        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
