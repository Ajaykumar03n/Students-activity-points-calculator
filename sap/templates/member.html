<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership</title>
    <style>
               * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url("https://img.freepik.com/premium-vector/seamless-pattern-with-different-school-objects_165488-4326.jpg?w=996");
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 20px;
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: rgb(151, 56, 210);
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 20px;
            color: rgb(51, 51, 51);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #333;
        }
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        input[type="file"]:focus,
        select:focus {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
            outline: none;
        }
        .radio-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .radio-group label {
            flex: 1;
            text-align: center;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: rgb(151, 56, 210);
            color: white;
            border-color: rgb(151, 56, 210);
        }

        .radio-group span {
            position: relative;
            width: 25px;
            height: 25px;
            background-color: #eee;
            border-radius: 50%;
            margin-right: 10px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
            outline: none;
        }

        input[type=submit] {
            width: 100%;
            background-color: rgb(151, 56, 210);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type=submit]:hover {
            background-color: rgb(120, 40, 170);
        }

        .note {
            margin: 10px 0;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
        .custom-file-upload {
            border: 1px solid #ddd;
            border-radius: 20px;
            display: inline-block;
            padding: 12px;
            cursor: pointer;
            background-color: #f9f9f9;
            font-size: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #eef6ff;
            border-color: rgb(151, 56, 210);
        }
        .file-input {
            display: none;
        }
        
        .file-upload-container {
            position: relative;
            width: 100%;
        }

        .file-upload-container input[type="file"] + label {
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Membership</h2>
    <form method="POST" action="{{ url_for('member') }}" enctype="multipart/form-data">
        <h3>Select Membership:</h3>
        <div class="radio-group">
            <input type="radio" name="member" value="NCC/NSS" id="NCC/NSS" required>
            <label for="NCC/NSS">NCC/NSS</label>
            <input type="radio" name="member" value="Professional Society" id="Professional Society">
            <label for="Professional Society">Professional Society</label>
            <input type="radio" name="member" value="Clubs" id="clubs">
            <label for="clubs">Clubs</label>
        </div>

        <div class="note">Note: If you have more than one membership, please fill out the form again.</div>

        <label for="proof">Upload Proof:</label>
        <div class="file-upload-container">
            <input type="file" id="proof" name="proof" class="file-input" required>
            <label for="proof" class="custom-file-upload">Choose File</label>
        </div>

        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
